<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html,body{margin:0;height:100%}
  @keyframes potPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.02)}
  }
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1)}
    50%{transform:scaleY(1.14) scaleX(0.95)}
  }
</style>
</helmet>
<div style="width:100%;height:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#DFD3BE">
  <svg width="440" height="440" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

    <!-- Badge -->
    <circle cx="200" cy="200" r="192" fill="#F2E8D6"/>
    <circle cx="200" cy="200" r="186" fill="none" stroke="#7B2E3A" stroke-width="7"/>

    <!-- ===== JAGO POT ===== -->
    <g style="transform-box:view-box;transform-origin:200px 235px;animation:potPulse 2.4s ease-in-out infinite">

      <!-- belly -->
      <ellipse cx="200" cy="235" rx="80" ry="60" fill="#7B2E3A"/>
      <ellipse cx="200" cy="235" rx="80" ry="60" fill="none" stroke="#D4A13D" stroke-width="5"/>

      <!-- neck / rim -->
      <polygon points="157,178 243,178 233,150 167,150" fill="#7B2E3A"/>
      <polygon points="157,178 243,178 233,150 167,150" fill="none" stroke="#D4A13D" stroke-width="4"/>

      <!-- gold decorative bands -->
      <path d="M132,214 Q200,240 268,214" fill="none" stroke="#D4A13D" stroke-width="5"/>
      <path d="M128,252 Q200,280 272,252" fill="none" stroke="#D4A13D" stroke-width="5"/>

      <!-- dots -->
      <circle cx="160" cy="233" r="6" fill="#D4A13D"/>
      <circle cx="200" cy="240" r="6" fill="#D4A13D"/>
      <circle cx="240" cy="233" r="6" fill="#D4A13D"/>
      <circle cx="180" cy="224" r="5" fill="#C9498A"/>
      <circle cx="220" cy="224" r="5" fill="#C9498A"/>

      <!-- diya tray -->
      <ellipse cx="200" cy="150" rx="56" ry="10" fill="#D4A13D"/>

      <!-- flames -->
      <g style="transform-box:view-box;transform-origin:200px 148px;animation:flicker 0.55s ease-in-out infinite">
        <path d="M150,148 C134,124 143,140 150,122 C157,140 166,124 150,148 Z" fill="#D4A13D"/>
        <path d="M250,148 C234,124 243,140 250,122 C257,140 266,124 250,148 Z" fill="#D4A13D"/>
        <path d="M175,148 C159,124 168,128 175,110 C182,128 191,124 175,148 Z" fill="#D4A13D"/>
        <path d="M225,148 C209,124 218,128 225,110 C232,128 241,124 225,148 Z" fill="#D4A13D"/>
        <path d="M200,148 C184,124 193,113 200,95 C207,113 216,124 200,148 Z" fill="#D4A13D"/>
        <path d="M200,144 C190,126 195,118 200,108 C205,118 210,126 200,144 Z" fill="#C9498A"/>
      </g>

    </g>
  </svg>
</div>
</x-dc>
</body>
</html>
